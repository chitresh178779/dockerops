metadata:
  id: networking
  order: 3
  title: "Islands in the Bridge"
  concept: "networking"
  difficulty: easy
  estimatedMinutes: 25
  prerequisites: [images-registry]
  xpReward: 130
  commandFamilies: [networking, container-lifecycle, inspection]
  learningGoals:
    - "Create user-defined networks"
    - "Connect containers to networks"
    - "Diagnose connectivity failures"

narrative:
  role: "You're on-call for prod-01. Two services just got deployed by two different people."
  incident: >
    'api' is supposed to call 'web' by container name for every request, but
    every call times out. Both containers show as running. Nobody thought to
    put them on the same network.
  symptoms:
    - "Both 'web' and 'api' show 'running' in docker ps."
    - "api's calls to http://web/ never resolve — not even a connection refused, just silence."
  missionBrief: >
    Give web and api a real shared network so they can find each other by
    name, then prove the connection actually works.
  timeline:
    - "10:10 — web deployed with docker run, no --network flag."
    - "10:14 — api deployed the same way, by someone else, also with no --network flag."
    - "10:20 — First failed request between them; nobody notices until now."

environment:
  hostName: prod-01
  images:
    - repository: busybox
      tag: "1.36"
      pull: true
  networks: []
  volumes: []
  containers:
    - name: web
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo web-online > /www/index.html && httpd -f -p 80 -h /www"]
      startState: running
      env: {}
      networks: []
      volumes: []
      ports: []
    - name: api
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      startState: running
      env: {}
      networks: []
      volumes: []
      ports: []

hiddenState:
  - "web and api are both on Docker's default bridge network, which doesn't give containers name-based DNS resolution."
  - "No user-defined network exists on this host yet."

parts:
  - id: investigate
    kind: investigate
    title: "Confirm the network gap"
    objective: "Check what networks exist, and prove api really can't reach web by name."
    briefing: >
      docker network ls shows you every network on the host. Then try the
      actual call api would make — reproducing the failure is the fastest way
      to confirm the diagnosis.
    hints:
      - id: investigate-hint-1
        tier: concept
        text: "Containers can only resolve each other by name if they share a user-defined network. The default bridge network doesn't do name-based DNS."
        xpCost: 0
      - id: investigate-hint-2
        tier: direction
        text: "List the host's networks, then try calling web from inside api."
        xpCost: 5
      - id: investigate-hint-3
        tier: command
        text: "Try: docker network ls, then docker exec api wget -qO- http://web/"
        xpCost: 10
      - id: investigate-hint-4
        tier: explanation
        text: >
          If there's no user-defined bridge network on the host, and neither
          container was started with --network, they're both stuck on the
          default bridge — which only supports reaching each other by IP, not name.
        xpCost: 0
    docRefs: [networking-basics, containers-inspecting]
    completionConditions:
      - type: command_used
        pattern: 'docker\s+network\s+ls'
      - type: command_used
        pattern: 'docker\s+exec\s+api\s+wget'

  - id: fix
    kind: fix
    title: "Build the shared network"
    objective: "Create a user-defined network named app-net and connect both web and api to it."
    briefing: >
      A shared user-defined bridge network gives you real name-based service
      discovery. Create it, then attach both existing containers to it — no
      need to recreate them.
    hints:
      - id: fix-hint-1
        tier: concept
        text: "You don't have to recreate a running container to add it to a network — docker network connect attaches it in place."
        xpCost: 0
      - id: fix-hint-2
        tier: direction
        text: "Create a bridge network called app-net, then connect both web and api to it."
        xpCost: 5
      - id: fix-hint-3
        tier: command
        text: "Try: docker network create app-net, then docker network connect app-net web, then docker network connect app-net api"
        xpCost: 10
      - id: fix-hint-4
        tier: explanation
        text: >
          Once both containers share app-net, Docker's embedded DNS server
          resolves each container's name to its address on that network —
          that's what makes http://web/ from inside api start working.
        xpCost: 0
    docRefs: [networking-basics]
    completionConditions:
      - type: network_exists
        target: app-net
      - type: network_connected
        container: web
        network: app-net
        connected: true
      - type: network_connected
        container: api
        network: app-net
        connected: true

  - id: verify
    kind: verify
    title: "Prove the connection"
    objective: "Show that api can actually reach web by name over HTTP now."
    briefing: >
      Re-run the exact call that failed during investigation. If it comes
      back with web's real content this time, the network is truly fixed —
      not just configured.
    hints:
      - id: verify-hint-1
        tier: direction
        text: "Run the same wget from api to web again and check what comes back."
        xpCost: 0
      - id: verify-hint-2
        tier: command
        text: "Try: docker exec api wget -qO- http://web/"
        xpCost: 5
    docRefs: [networking-basics]
    completionConditions:
      - type: exec_output_contains
        target: api
        command: ["docker", "exec", "api", "wget", "-qO-", "http://web/"]
        contains: "web-online"
      - type: container_state
        target: web
        equals: running
      - type: container_state
        target: api
        equals: running

winCondition:
  - type: network_exists
    target: app-net
  - type: network_connected
    container: web
    network: app-net
    connected: true
  - type: network_connected
    container: api
    network: app-net
    connected: true
  - type: exec_output_contains
    target: api
    command: ["docker", "exec", "api", "wget", "-qO-", "http://web/"]
    contains: "web-online"

failureConditions: []

achievements:
  - id: network-detective
    title: "Network Detective"
    description: "Diagnosed a name-resolution failure between two containers."
  - id: bridge-builder
    title: "Bridge Builder"
    description: "Connected two isolated services with a real user-defined network."
